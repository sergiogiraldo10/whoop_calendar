name: WHOOP daily text

on:
  # Same schedule as reconcile.yml — see that file for the EST/EDT rationale.
  #   Tue-Thu  8:15 ET -> 13:15 UTC (EST) / 12:15 UTC (EDT)
  #   Every other day 11:00 ET -> 16:00 UTC (EST) / 15:00 UTC (EDT)
  schedule:
    - cron: "15 13 * * 2,3,4"
    - cron: "15 12 * * 2,3,4"
    - cron: "0 16 * * 0,1,5,6"
    - cron: "0 15 * * 0,1,5,6"
  workflow_dispatch: {}

jobs:
  daily-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m jobs.daily_text
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
