name: Reconcile WHOOP data

on:
  # Target local times (America/New_York), each given as both its EST and EDT
  # UTC equivalent since GitHub cron doesn't shift for daylight saving. Firing
  # twice a day is fine — the calendar upsert in jobs/reconcile.py is idempotent —
  # and GitHub can delay scheduled runs by hours regardless, so "roughly" these times.
  #   Mon/Fri  9:00 ET -> 14:00 UTC (EST) / 13:00 UTC (EDT)
  #   Tue-Thu  7:00 ET -> 12:00 UTC (EST) / 11:00 UTC (EDT)
  #   Sat/Sun 11:00 ET -> 16:00 UTC (EST) / 15:00 UTC (EDT)
  schedule:
    - cron: "0 14 * * 1,5"
    - cron: "0 13 * * 1,5"
    - cron: "0 12 * * 2,3,4"
    - cron: "0 11 * * 2,3,4"
    - cron: "0 16 * * 0,6"
    - cron: "0 15 * * 0,6"
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m jobs.reconcile
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CALENDAR_ID: ${{ vars.CALENDAR_ID }}
